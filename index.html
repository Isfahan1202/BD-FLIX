<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>BD FLIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:system-ui,sans-serif}.wrap{width:min(1100px,calc(100% - 30px));margin:auto}header{padding:18px 0;border-bottom:1px solid #292929;position:sticky;top:0;background:#090909ed}nav{display:flex;justify-content:space-between}.brand{font-size:22px;font-weight:900;letter-spacing:2px;color:white;text-decoration:none}.brand span{color:#888;font-weight:400}nav a:not(.brand){color:#aaa;text-decoration:none;margin-left:16px}.hero{padding:65px 0 50px;background:radial-gradient(ellipse at 75% 30%,#333,#090909 65%)}.kicker{letter-spacing:3px;color:#aaa;font-size:11px;font-weight:bold}.hero h1{font-size:clamp(44px,8vw,76px);line-height:.98;letter-spacing:-3px;margin:17px 0}.hero p{color:#aaa;line-height:1.7;max-width:600px}.btn{background:#f5f5f5;color:#090909;border:0;border-radius:6px;padding:12px 17px;font-weight:800;cursor:pointer}.section{padding:25px 0 40px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.search{background:#151515;border:1px solid #333;color:white;padding:12px;border-radius:6px;width:min(280px,55vw)}.filters{display:flex;gap:8px;overflow:auto;padding:8px 0 18px}.filter{border:1px solid #333;background:#151515;color:#aaa;padding:9px 15px;border-radius:30px}.filter.active{background:white;color:#111}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.card{cursor:pointer;min-width:0}.poster{aspect-ratio:2/3;border-radius:7px;overflow:hidden;background:linear-gradient(145deg,#374151,#111827);position:relative}.poster img{width:100%;height:100%;object-fit:cover}.poster b{position:absolute;inset:0;display:flex;align-items:end;padding:14px;background:linear-gradient(0deg,#000c,transparent 65%);font-size:20px}.card h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#999}.empty{grid-column:1/-1;text-align:center;color:#999;padding:35px;border:1px dashed #333}footer{border-top:1px solid #292929;padding:22px 0;color:#777;font-size:12px}footer a{color:#aaa}@media(max-width:850px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head{align-items:flex-start;flex-direction:column}.search{width:100%}.hero{padding:50px 0 35px}}
</style></head><body>
<header><div class="wrap"><nav><a class="brand" href="/">BD <span>FLIX</span></a><div><a href="#browse">Browse</a><a href="/admin">Admin</a></div></nav></div></header>
<section class="hero"><div class="wrap"><div class="kicker">A WORLD OF STORIES</div><h1>Find your next<br>favourite.</h1><p>Movies, series and anime — explore the collection and enjoy a clean, simple viewing experience.</p><button class="btn" onclick="document.querySelector('#browse').scrollIntoView({behavior:'smooth'})">Explore titles ↓</button></div></section>
<section class="section wrap" id="browse"><div class="head"><h2>Explore the collection</h2><input id="search" class="search" type="search" placeholder="Search titles..."></div><div class="filters" id="filters"><button class="filter active" data-type="All">All</button><button class="filter" data-type="Movie">Movies</button><button class="filter" data-type="Series">Series</button><button class="filter" data-type="Anime">Anime</button></div><div class="grid" id="grid"><div class="empty">Loading catalogue...</div></div></section>
<footer><div class="wrap">© 2026 BD FLIX · Only authorized content is intended to be listed or streamed. <a href="/admin">Admin</a></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script>
const ready=window.supabase&&window.BD_FLIX_SUPABASE_URL&&!window.BD_FLIX_SUPABASE_URL.includes("PASTE_")&&window.BD_FLIX_SUPABASE_ANON_KEY&&!window.BD_FLIX_SUPABASE_ANON_KEY.includes("PASTE_");
const db=ready?supabase.createClient(BD_FLIX_SUPABASE_URL,BD_FLIX_SUPABASE_ANON_KEY):null;let rows=[],type="All";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){let q=$("search").value.toLowerCase().trim(),a=rows.filter(x=>(type==="All"||x.type===type)&&(`${x.title} ${x.genre||""} ${x.release_year||""}`).toLowerCase().includes(q));$("grid").innerHTML=a.length?a.map(x=>`<article class="card" onclick="openTitle('${x.id}')"><div class="poster">${x.poster_url?`<img src="${esc(x.poster_url)}" alt="">`:""}<b>${esc(x.title)}</b></div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.release_year||"")} · ${esc(x.type)}</div></article>`).join(""):'<div class="empty">No published titles found.</div>'}
window.openTitle=id=>{let x=rows.find(y=>y.id===id);if(!x)return;let w=window.open("","_blank");w.document.write(`<title>${esc(x.title)}</title><body style="background:#090909;color:white;font:16px system-ui;padding:20px"><h1>${esc(x.title)}</h1><p>${esc(x.description||"")}</p>${x.video_url?`<video controls playsinline src="${esc(x.video_url)}" style="width:100%;max-width:900px"></video>`:"Video not added yet."}</body>`)};
async function load(){if(!db){$("grid").innerHTML='<div class="empty">Add Supabase URL and Publishable key in supabase-config.js to load your database catalogue.</div>';return}let {data,error}=await db.from("movies").select("id,title,type,genre,release_year,description,poster_url,video_url").eq("is_published",true).order("created_at",{ascending:false});if(error){$("grid").innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}rows=data||[];render()}
$("filters").onclick=e=>{let b=e.target.closest("[data-type]");if(!b)return;type=b.dataset.type;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()};$("search").oninput=render;load();
</script></body></html>
